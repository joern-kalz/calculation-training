<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculation Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Start Screen */
        .target-selector {
            margin: 2rem 0;
        }

        .target-selector label {
            display: block;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: #aaa;
        }

        .target-selector input[type="range"] {
            width: 100%;
            max-width: 300px;
            height: 8px;
            border-radius: 4px;
            background: #333;
            outline: none;
            -webkit-appearance: none;
            margin-bottom: 1rem;
        }

        .target-selector input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #00d9ff;
            cursor: pointer;
            box-shadow: 0 0 10px #00d9ff;
        }

        .target-value {
            font-size: 3rem;
            font-weight: bold;
            color: #00ff88;
        }

        .btn {
            padding: 1rem 2rem;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            color: #1a1a2e;
            font-weight: bold;
            margin-top: 1rem;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
        }

        /* Game Screen */
        .game-info {
            margin-bottom: 2rem;
        }

        .round-counter {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 1rem;
        }

        .shown-number {
            font-size: 4rem;
            font-weight: bold;
            color: #00d9ff;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
        }

        .plus-sign {
            font-size: 2rem;
            color: #888;
            margin-bottom: 0.5rem;
        }

        .target-display {
            font-size: 1.5rem;
            color: #aaa;
        }

        .timer-container {
            margin: 1.5rem 0;
        }

        .timer-bar {
            width: 100%;
            max-width: 300px;
            height: 12px;
            background: #333;
            border-radius: 6px;
            overflow: hidden;
            margin: 0 auto;
        }

        .timer-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77);
            border-radius: 6px;
            transition: width 0.1s linear;
        }

        .timer-fill.danger {
            background: linear-gradient(90deg, #ff6b6b, #ff0000);
        }

        .number-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
            gap: 10px;
            max-width: 400px;
            margin: 0 auto;
        }

        .num-btn {
            padding: 1rem;
            font-size: 1.5rem;
            border: 2px solid #444;
            border-radius: 8px;
            background: #222;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .num-btn:hover {
            border-color: #00d9ff;
            background: #333;
            transform: scale(1.1);
        }

        .num-btn.correct {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.2);
        }

        .num-btn.wrong {
            border-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.2);
            animation: shake 0.3s ease;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        /* Win Screen */
        .win-message {
            font-size: 2rem;
            color: #00ff88;
            margin-bottom: 1rem;
        }

        .win-stats {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 2rem;
        }

        /* Lose Screen */
        .lose-message {
            font-size: 2rem;
            color: #ff6b6b;
            margin-bottom: 1rem;
        }

        .lose-info {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 2rem;
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }
    </style>
</head>

<body>
    <canvas id="confetti-canvas"></canvas>

    <div class="container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <h1>Calculation Game</h1>
            <p style="color: #aaa; margin-bottom: 2rem;">Add the shown number to reach the target!</p>

            <div class="target-selector">
                <label>Select Target Number</label>
                <input type="range" id="target-input" min="1" max="20" value="10">
                <div class="target-value" id="target-display">10</div>
            </div>

            <button class="btn" id="start-btn">Start Game</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div class="game-info">
                <div class="round-counter">Round <span id="current-round">1</span> of <span id="total-rounds">11</span>
                </div>
                <div class="shown-number" id="shown-number">0</div>
                <div class="plus-sign">+ ? = <span id="game-target">10</span></div>
            </div>

            <div class="timer-container">
                <div class="timer-bar">
                    <div class="timer-fill" id="timer-fill"></div>
                </div>
            </div>

            <div class="number-buttons" id="number-buttons"></div>
        </div>

        <!-- Win Screen -->
        <div id="win-screen" class="screen">
            <h1>🎉 You Win! 🎉</h1>
            <div class="win-message">Congratulations!</div>
            <div class="win-stats">Target: <span id="win-target">10</span> | Time: <span id="win-time">0</span>s</div>
            <button class="btn" id="play-again-win">Play Again</button>
        </div>

        <!-- Lose Screen -->
        <div id="lose-screen" class="screen">
            <h1>Game Over</h1>
            <div class="lose-message">Time's Up!</div>
            <div class="lose-info">You reached round <span id="lose-round">1</span></div>
            <button class="btn" id="play-again-lose">Try Again</button>
        </div>
    </div>

    <script>
        const timerDuration = 10000;
        // Game State
        let target = 10;
        let numbers = [];
        let currentIndex = 0;
        let timerInterval = null;
        let timeLeft = timerDuration;
        let startTime = 0;

        // DOM Elements
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const winScreen = document.getElementById('win-screen');
        const loseScreen = document.getElementById('lose-screen');
        const targetInput = document.getElementById('target-input');
        const targetDisplay = document.getElementById('target-display');
        const shownNumber = document.getElementById('shown-number');
        const numberButtons = document.getElementById('number-buttons');
        const timerFill = document.getElementById('timer-fill');
        const currentRoundEl = document.getElementById('current-round');
        const totalRoundsEl = document.getElementById('total-rounds');
        const gameTargetEl = document.getElementById('game-target');

        // Target Selection
        targetInput.addEventListener('input', (e) => {
            targetDisplay.textContent = e.target.value;
        });

        // Start Game
        document.getElementById('start-btn').addEventListener('click', () => {
            target = parseInt(targetInput.value);
            startGame();
        });

        // Play Again Buttons
        document.getElementById('play-again-win').addEventListener('click', () => {
            showScreen('start');
        });

        document.getElementById('play-again-lose').addEventListener('click', () => {
            showScreen('start');
        });

        function showScreen(screen) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            if (screen === 'start') startScreen.classList.add('active');
            else if (screen === 'game') gameScreen.classList.add('active');
            else if (screen === 'win') winScreen.classList.add('active');
            else if (screen === 'lose') loseScreen.classList.add('active');
        }

        function startGame() {
            // Generate shuffled numbers 0 to target
            numbers = [];
            for (let i = 0; i <= target; i++) {
                numbers.push(i);
            }
            // Fisher-Yates shuffle
            for (let i = numbers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
            }

            currentIndex = 0;
            startTime = Date.now();

            gameTargetEl.textContent = target;
            totalRoundsEl.textContent = numbers.length;

            showScreen('game');
            showRound();
        }

        function showRound() {
            const num = numbers[currentIndex];
            shownNumber.textContent = num;
            currentRoundEl.textContent = currentIndex + 1;

            // Create number buttons
            numberButtons.innerHTML = '';
            for (let i = 0; i <= target; i++) {
                const btn = document.createElement('button');
                btn.className = 'num-btn';
                btn.textContent = i;
                btn.addEventListener('click', () => checkAnswer(i, btn));
                numberButtons.appendChild(btn);
            }

            // Start timer
            startTimer();
        }

        function startTimer() {
            timeLeft = timerDuration;
            updateTimerDisplay();

            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                timeLeft -= 50;
                updateTimerDisplay();

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    gameOver();
                }
            }, 50);
        }

        function updateTimerDisplay() {
            const percentage = (timeLeft / timerDuration) * 100;
            timerFill.style.width = percentage + '%';

            if (percentage < 30) {
                timerFill.classList.add('danger');
            } else {
                timerFill.classList.remove('danger');
            }
        }

        function checkAnswer(clickedNum, btn) {
            const shownNum = numbers[currentIndex];
            const correctNum = target - shownNum;

            if (clickedNum === correctNum) {
                // Correct answer
                btn.classList.add('correct');
                setTimeout(() => {
                    currentIndex++;
                    if (currentIndex >= numbers.length) {
                        winGame();
                    } else {
                        showRound();
                    }
                }, 200);
            } else {
                // Wrong answer
                btn.classList.add('wrong');
                setTimeout(() => {
                    btn.classList.remove('wrong');
                }, 300);
            }
        }

        function gameOver() {
            clearInterval(timerInterval);
            document.getElementById('lose-round').textContent = currentIndex + 1;
            showScreen('lose');
        }

        function winGame() {
            clearInterval(timerInterval);
            const totalTime = ((Date.now() - startTime) / 1000).toFixed(1);
            document.getElementById('win-target').textContent = target;
            document.getElementById('win-time').textContent = totalTime;
            showScreen('win');
            startConfetti();
        }

        // Confetti Animation
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let confettiParticles = [];
        let confettiAnimationId = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function startConfetti() {
            confettiParticles = [];
            const colors = ['#00d9ff', '#00ff88', '#ff6b6b', '#ffd93d', '#6bcb77', '#c56cf0'];

            for (let i = 0; i < 150; i++) {
                confettiParticles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 10 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speedY: Math.random() * 3 + 2,
                    speedX: Math.random() * 4 - 2,
                    rotation: Math.random() * 360,
                    rotationSpeed: Math.random() * 10 - 5
                });
            }

            if (confettiAnimationId) cancelAnimationFrame(confettiAnimationId);
            animateConfetti();
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let activeParticles = 0;

            confettiParticles.forEach(p => {
                p.y += p.speedY;
                p.x += p.speedX;
                p.rotation += p.rotationSpeed;

                if (p.y < canvas.height) {
                    activeParticles++;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation * Math.PI / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
                    ctx.restore();
                }
            });

            if (activeParticles > 0) {
                confettiAnimationId = requestAnimationFrame(animateConfetti);
            }
        }
    </script>
</body>

</html>
